<section class="content-container">
    <div class="input-group mt-5">
        <div class="form-floating produktfeld">
            <input type="email" class="form-control" id="floatingInput" placeholder="Wurst, Getränk etc">
            <label for="floatingInput">Produkt</label>
        </div>
    </div>
    <div class="input-group mt-5">
        <div class="form-floating preisfeld">
            <input type="number" class="form-control" placeholder="0.00" step="0.01" min="0">
            <label for="floatingInputGroup1">Preis</label>
        </div>
        <span class="input-group-text">€</span>
    </div>
    <div class="angebot">
        <input type="radio" class="btn-check" name="options-outlined" id="success-outlined" autocomplete="off" checked>
        <label class="btn btn-outline-success" for="success-outlined">Im Angebot</label>
        <input type="radio" class="btn-check" name="options-outlined" id="danger-outlined" autocomplete="off">
        <label class="btn btn-outline-danger" for="danger-outlined">Kein Angebot</label>
    </div>
    <div class="badges">
        <select id="badgeSelect" class="form-select" aria-label="Default select example" (change)="onSelect($event)">
            <option value="" selected disabled>Shop</option>
            <option value="Aldi" data-img="public/Images/aldi_logo.webp">Aldi</option>
            <option value="Lidl" data-img="public/Images/aldi_logo.webp">Lidl</option>
            <option value="Netto rot" data-img="public/Images/netto_rot.webp">Netto rot</option>
            <option value="Netto schwarz" data-img="public/Images/netto_schwarz.webp">Netto schwarz</option>
            <option value="Rewe" data-img="public/Images/rewe_logo.webp">Rewe</option>
        </select>
        <div class="mt-3">
            <span *ngFor="let badge of badges"
                class="badge bg-light border me-2 d-inline-flex align-items-center">
            <img [src]="badge.img" [alt]="badge.name"
                style="width:20px; height:20px; margin-right:6px;"> {{ badge.name }}
            </span>
        </div>
    </div>
    <app-buttons [btntext]="'Speichern'"></app-buttons>
</section>
